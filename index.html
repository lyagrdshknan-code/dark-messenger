<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dark Messenger</title><link rel="stylesheet" href="/style.css"></head><body><div id="toast"></div><section id="auth"><div class="card"><h1>DARK<span>MESSENGER</span></h1><p>Real-time group messenger</p><div class="tabs"><button id="loginTab" class="active">Login</button><button id="regTab">Create account</button></div><form id="form"><input id="user" placeholder="Username" required><input id="pass" type="password" placeholder="Password" required><button class="primary">Login</button></form><small id="err"></small></div></section><section id="app" class="hidden"><aside><h2>DARK<span>MESSENGER</span></h2><div class="me"><button id="avatar"><img id="meAvatar"></button><b id="meName"></b><i>● Online</i><input id="avatarFile" type="file" accept="image/*" hidden></div><label>CHANNELS</label><button class="nav active" data-p="chat">💬 Group Chat</button><button class="nav" data-p="voice">🎙️ Voice Rooms</button><label>VOICE ROOMS</label><button class="room" data-r="General">🔊 General</button><button class="room" data-r="Gaming">🎮 Gaming</button><button class="room" data-r="Chill">🌙 Chill</button><div class="bottom"><span id="status">● Connected</span><button id="logout">Logout</button></div></aside><main><header><div><h3 id="title">Group Chat</h3><small id="sub">Everyone can talk here</small></div><input id="search" placeholder="Search messages..."></header><section id="chat" class="panel"><div id="messages"></div><div id="reply" class="hidden"></div><div class="composer"><input id="file" type="file" hidden><button id="attach">＋</button><button id="emoji">☺</button><textarea id="text" rows="1" placeholder="Write a message..."></textarea><button id="rec">🎙</button><button id="send" class="send">➤</button><div id="emojis" class="hidden">😀 😃 😄 😂 🙂 😉 😊 😎 😍 🤩 😭 😡 🤔 🥳 🔥 ❤️ 👍 🎮 🚀</div></div><div id="upload"></div></section><section id="voice" class="panel hidden"><div class="voiceIntro"><div>🎙️</div><h1>Voice Rooms</h1><p>Talk with people in real time.</p><button class="primary join" data-r="General">Join General</button> <button class="secondary join" data-r="Gaming">Join Gaming</button> <button class="secondary join" data-r="Chill">Join Chill</button></div><div id="stage" class="stage hidden"><b id="roomName"></b><button id="leave">Leave</button><div id="voiceUsers"></div><button id="mute">🎙</button><button id="screen">🖥️</button></div></section></main></section><script src="/socket.io/socket.io.js"></script><script src="/app.js"></script></body></html>
